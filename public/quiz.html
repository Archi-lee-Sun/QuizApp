<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizMind — Playing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>

  <div class="bg-grid" aria-hidden="true"></div>

  <!-- Loading Screen -->
  <div class="loading-screen" id="loading-screen" role="status" aria-live="polite">
    <div class="loading-inner">
      <div class="loading-spinner" aria-hidden="true"></div>
      <div class="loading-label">GENERATING QUIZ</div>
      <div class="loading-topic" id="loading-topic"></div>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div class="quiz-screen hidden" id="quiz-screen">

    <header class="quiz-header">
      <a href="/" class="back-btn">← Back</a>
      <div class="quiz-meta" id="quiz-meta"></div>
      <div class="quiz-counter" id="quiz-counter" aria-live="polite">1 / 10</div>
    </header>

    <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <main class="quiz-main">
      <div class="question-card" id="question-card">
        <div class="question-num" id="question-num" aria-hidden="true">Q01</div>
        <div class="question-text" id="question-text" role="heading" aria-level="2"></div>

        <div class="options-grid" id="options-grid" role="list"></div>

        <div class="explanation-box hidden" id="explanation-box" aria-live="polite">
          <div class="explanation-label" aria-hidden="true">INSIGHT</div>
          <div class="explanation-text" id="explanation-text"></div>
          <button class="next-btn" id="next-btn">
            <span id="next-btn-text">Next Question</span>
            <span class="next-arrow" aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Results Screen -->
  <div class="results-screen hidden" id="results-screen" aria-live="polite">
    <div class="results-inner">
      <div class="results-label">QUIZ COMPLETE</div>
      <div class="results-score-wrap">
        <div class="results-score" id="results-score">0</div>
        <div class="results-total" id="results-total">/10</div>
      </div>
      <div class="results-message" id="results-message"></div>
      <div class="results-bar" aria-hidden="true">
        <div class="results-bar-fill" id="results-bar-fill"></div>
      </div>
      <div class="results-actions">
        <a href="/" class="results-btn primary">Try Another Topic</a>
        <a href="/" class="results-btn secondary">View History</a>
      </div>
    </div>
  </div>

  <script src="js/quiz.js"></script>
</body>
</html>
